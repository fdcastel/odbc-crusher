# Composite action — docs/old-IMPROVEMENT_PLAN.md §6.9 (originally) and §7.5
# (master-tracking pivot). The `§N.M` numbering is the *old* plan's; the
# current docs/IMPROVEMENT_PLAN.md uses lettered row IDs (F12, H11, …) and has
# no § sections at all, so an unqualified "IMPROVEMENT_PLAN.md §6.9" sent the
# reader to a document where that identifier does not exist.
#
# Each stress-test driver job used to repeat ~25 lines of: download
# odbc-crusher from the latest release, run it text + JSON, upload
# report artifact. Six near-identical copies. This action absorbs
# that boilerplate so each job carries only its unique DB-and-driver
# setup, plus a single `uses:` step.
#
# Source of the binary:  the latest **successful master CI run**
# (workflow `ci.yml`), NOT the latest GitHub release. This closes the
# release-cadence gap — every stress-test invocation exercises the
# probes that are in master right now, not whatever shipped at the
# previous tag. Picks the right OS-specific artifact based on the
# caller's runner.
name: Run odbc-crusher against a driver
description: >
  Resolves the latest successful master CI run, downloads the matching
  OS-specific odbc-crusher artifact, runs it twice (verbose text and
  JSON), and uploads both reports plus the caller's actual_version.txt
  as a single artifact. Caller supplies the connection string and the
  report artifact suffix.

inputs:
  artifact-name:
    description: 'Suffix for the report artifact (e.g. postgresql, mock-driver)'
    required: true
  conn-string:
    description: 'ODBC connection string passed verbatim to odbc-crusher'
    required: true
  ld-library-path:
    description: 'Optional path prepended to LD_LIBRARY_PATH (drivers shipped as a tarball typically need this)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve latest master CI run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Recent gh CLI versions silently drop `--status success` here
        # (filters on `status`, not `conclusion`, returning []). Pull the
        # last 10 master runs and pick the most recent success via jq —
        # robust across gh versions.
        # F4: the raw run list was printed here on every job, from the
        # diagnostic commit ddcf3cd. The parsing bug it was investigating was
        # fixed in e35a8a7; the noise stayed. The error branch below still
        # says what to do when resolution fails, which is the part that was
        # ever useful.
        RUN_ID=$(gh run list --workflow ci.yml --branch master --limit 10 \
          --json databaseId,conclusion \
          -q '[.[] | select(.conclusion == "success")] | .[0].databaseId')
        if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
          echo "::error::No successful master CI run found — cannot fetch latest crusher binary. Wait for a green ci.yml on master, then re-run stress-test."
          exit 1
        fi
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
        echo "Using crusher binary from CI run $RUN_ID ($RUN_URL)"
        {
          echo "CRUSHER_RUN_ID=$RUN_ID"
          echo "CRUSHER_RUN_URL=$RUN_URL"
        } >> "$GITHUB_ENV"

    - name: Download odbc-crusher artifact (per OS)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        case "${{ runner.os }}" in
          Linux)   ART="odbc-crusher-Linux-Release"   ; BIN="./crusher-bin/odbc-crusher" ;;
          Windows) ART="odbc-crusher-Windows-Release" ; BIN="./crusher-bin/Release/odbc-crusher.exe" ;;
          macOS)   ART="odbc-crusher-macOS-Release"   ; BIN="./crusher-bin/odbc-crusher" ;;
          *)
            echo "::error::Unsupported runner OS: ${{ runner.os }}"
            exit 1
            ;;
        esac
        gh run download "$CRUSHER_RUN_ID" --repo "${{ github.repository }}" \
          -n "$ART" -D crusher-bin
        chmod +x "$BIN" 2>/dev/null || true
        ls -laR crusher-bin/
        echo "CRUSHER_BIN=$BIN" >> "$GITHUB_ENV"

    - name: Run odbc-crusher (verbose text)
      shell: bash
      # continue-on-error preserved per stress-test workflow's intent —
      # the deliverable is the artifact, not the workflow status; real
      # drivers fail many conformance tests by design.
      # The `timeout` wrapper caps a hung probe (e.g. a driver that
      # infinite-loops on a shape, or a SIGSEGV that corrupts the DM and
      # leaves crusher's cleanup path stuck) so the workflow doesn't
      # hold a runner for the 6h job-default. 10m hard cap is enough
      # for a real run (typical: <2m) but short enough to surface hangs
      # as a deliberate signal in the partial text report. SIGTERM at
      # 9:30 gives crusher a chance to flush; SIGKILL at 10:00 is
      # uncatchable so a wedged signal handler can't keep the runner
      # alive past the cap. Composite action steps don't support
      # `timeout-minutes`, hence the shell-level wrap.
      continue-on-error: true
      run: |
        if [[ -n "${{ inputs.ld-library-path }}" ]]; then
          export LD_LIBRARY_PATH="${{ inputs.ld-library-path }}:${LD_LIBRARY_PATH:-}"
        fi
        # F10: this action has a macOS branch for artifact selection and
        # then called GNU `timeout` unconditionally, which a macOS runner
        # does not have — so it advertised support it did not have. Latent
        # today (there is no macOS stress-test job) and cheaper to fix than
        # to rediscover when someone adds one. `gtimeout` is coreutils via
        # Homebrew; falling through to no timeout at all is wrong, because
        # the 570s bound is what stops a wedged driver holding the runner.
        run_with_timeout() {
          if command -v timeout >/dev/null 2>&1; then
            timeout --kill-after=30 570 "$@"
          elif command -v gtimeout >/dev/null 2>&1; then
            gtimeout --kill-after=30 570 "$@"
          else
            echo "::error::Neither timeout nor gtimeout is available; refusing to run a driver unbounded"
            return 1
          fi
        }
        # F12: --fail-on=none, so probe results do not set the exit code and
        # a non-zero one means the *tool* did not finish. G3 added this flag;
        # before it, crusher exited 1 for any FAIL and the only way to keep
        # the job green was continue-on-error, which also swallowed a killed
        # run. `set +e` and PIPESTATUS because the pipe into tee would
        # otherwise report tee's status, which is always 0.
        set +e
        run_with_timeout "$CRUSHER_BIN" "${{ inputs.conn-string }}" --fail-on=none -v 2>&1 | tee crusher-report.txt
        CRUSHER_RC=${PIPESTATUS[0]}
        set -e
        echo "crusher exit code: $CRUSHER_RC"
        case "$CRUSHER_RC" in
          0) ;;
          124|137)
            echo "::warning::crusher was KILLED at the 570s timeout (exit $CRUSHER_RC) — the driver wedged. The report below is partial." ;;
          2)
            echo "::warning::crusher could not connect (exit 2) — see the report for the ODBC diagnostics." ;;
          *)
            echo "::warning::crusher exited $CRUSHER_RC, which is not a probe result — the run did not complete normally." ;;
        esac

    - name: Run odbc-crusher (JSON)
      shell: bash
      continue-on-error: true
      run: |
        if [[ -n "${{ inputs.ld-library-path }}" ]]; then
          export LD_LIBRARY_PATH="${{ inputs.ld-library-path }}:${LD_LIBRARY_PATH:-}"
        fi
        # F10: this action has a macOS branch for artifact selection and
        # then called GNU `timeout` unconditionally, which a macOS runner
        # does not have — so it advertised support it did not have. Latent
        # today (there is no macOS stress-test job) and cheaper to fix than
        # to rediscover when someone adds one. `gtimeout` is coreutils via
        # Homebrew; falling through to no timeout at all is wrong, because
        # the 570s bound is what stops a wedged driver holding the runner.
        run_with_timeout() {
          if command -v timeout >/dev/null 2>&1; then
            timeout --kill-after=30 570 "$@"
          elif command -v gtimeout >/dev/null 2>&1; then
            gtimeout --kill-after=30 570 "$@"
          else
            echo "::error::Neither timeout nor gtimeout is available; refusing to run a driver unbounded"
            return 1
          fi
        }
        # F12: see the text run above. Same reasoning, no pipe to work around.
        set +e
        run_with_timeout "$CRUSHER_BIN" "${{ inputs.conn-string }}" --fail-on=none -o json -f crusher-report.json
        CRUSHER_RC=$?
        set -e
        echo "crusher exit code: $CRUSHER_RC"
        if [ "$CRUSHER_RC" -ne 0 ]; then
          echo "::warning::crusher exited $CRUSHER_RC on the JSON run; the report may be partial or missing."
        fi

    - name: Upload report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: report-${{ inputs.artifact-name }}
        # actual_version.txt is written by each driver job before this
        # composite runs — it carries the runtime-observed driver version
        # for the /triage-driver skill's provenance check. Optional: jobs
        # that don't write it just won't ship it (artifact upload tolerates
        # missing paths via if-no-files-found below).
        if-no-files-found: warn
        path: |
          crusher-report.txt
          crusher-report.json
          actual_version.txt
