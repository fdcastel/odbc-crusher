# Composite action — IMPROVEMENT_PLAN.md §6.9
#
# Each stress-test driver job used to repeat ~25 lines of: download
# odbc-crusher from the latest release, run it text + JSON, upload
# report artifact. Six near-identical copies. This action absorbs
# that boilerplate so each job carries only its unique DB-and-driver
# setup, plus a single `uses:` step.
name: Run odbc-crusher against a driver
description: >
  Downloads odbc-crusher from the latest GitHub release, runs it twice
  (verbose text and JSON), and uploads both reports as a single
  artifact. Caller supplies the connection string and the report
  artifact name.

inputs:
  artifact-name:
    description: 'Suffix for the report artifact (e.g. postgresql, mock-driver)'
    required: true
  conn-string:
    description: 'ODBC connection string passed verbatim to odbc-crusher'
    required: true
  ld-library-path:
    description: 'Optional path prepended to LD_LIBRARY_PATH (drivers shipped as a tarball typically need this)'
    required: false
    default: ''
  release-asset:
    description: 'GitHub release asset filename to download'
    required: false
    default: 'odbc-crusher-linux-x64.tar.gz'
  binary:
    description: 'Path to the crusher binary after extraction'
    required: false
    default: './odbc-crusher'

runs:
  using: composite
  steps:
    - name: Download odbc-crusher
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download --repo fdcastel/odbc-crusher \
          --pattern "${{ inputs.release-asset }}" --dir .
        case "${{ inputs.release-asset }}" in
          *.tar.gz) tar xzf "${{ inputs.release-asset }}" ;;
          *.zip)    unzip -o "${{ inputs.release-asset }}" ;;
        esac
        chmod +x "${{ inputs.binary }}" 2>/dev/null || true

    - name: Run odbc-crusher (verbose text)
      shell: bash
      # continue-on-error preserved per stress-test workflow's intent —
      # the deliverable is the artifact, not the workflow status; real
      # drivers fail many conformance tests by design.
      continue-on-error: true
      run: |
        if [[ -n "${{ inputs.ld-library-path }}" ]]; then
          export LD_LIBRARY_PATH="${{ inputs.ld-library-path }}:${LD_LIBRARY_PATH:-}"
        fi
        "${{ inputs.binary }}" "${{ inputs.conn-string }}" -v 2>&1 | tee crusher-report.txt

    - name: Run odbc-crusher (JSON)
      shell: bash
      continue-on-error: true
      run: |
        if [[ -n "${{ inputs.ld-library-path }}" ]]; then
          export LD_LIBRARY_PATH="${{ inputs.ld-library-path }}:${LD_LIBRARY_PATH:-}"
        fi
        "${{ inputs.binary }}" "${{ inputs.conn-string }}" -o json -f crusher-report.json

    - name: Upload report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: report-${{ inputs.artifact-name }}
        path: |
          crusher-report.txt
          crusher-report.json
