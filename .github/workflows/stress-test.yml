# Stress-test the latest released odbc-crusher against five real ODBC
# drivers + the mock driver, on demand.
#
# Each driver job does its unique DB-and-driver setup, then delegates
# the common "download crusher / run text+JSON / upload report" tail to
# the .github/actions/run-crusher composite action (§6.9). Adding a new
# driver means writing one job with the install steps, no
# copy-pasting the upload boilerplate.
#
# Driver versions, binary URLs, source repos/tags, and connection
# strings are all defined in `.github/drivers.json` — the workflow
# reads from there at runtime. apt-installed drivers are pinned via
# `apt-get install pkg=version`; the install step fails loudly if
# Ubuntu drops the pinned version. After install, every job writes
# `actual_version.txt` next to the report so the /triage-driver skill
# can verify provenance.
name: Stress Test

on:
  # §7.1: the manifest pins an exact apt version per driver, and the install
  # step fails when Ubuntu drops it. That check is only worth having if it
  # runs, and until now nothing ran it - the row this closes was opened
  # because pins had changed and never once been exercised. Monthly, on the
  # 1st: often enough to catch a dropped package while it is still recent
  # news, cheap enough that seven driver jobs a month is not a burden.
  #
  # A scheduled run supplies no `inputs`, which is why every job's `if` below
  # spells out the default rather than comparing `inputs.driver` directly.
  schedule:
    - cron: '0 6 1 * *'

  workflow_dispatch:
    inputs:
      driver:
        description: 'Driver to test (all = run every job)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - postgresql
          - mariadb
          - mysql
          - duckdb
          - clickhouse
          - firebird
          - firebird-official
          - firebird-patched
          # T3. Both halves of the H17 pair in one workflow run. Dispatching
          # them separately worked, but nothing tied the two runs together:
          # `run-crusher` resolves "latest successful master CI run" for
          # itself, so a merge landing between the two dispatches gave each
          # half a different crusher binary and the comparison was silently
          # measuring two things at once. One run, one resolved binary — see
          # `resolve-crusher` below.
          - firebird-pair
          - mock-driver

# F6: least privilege. This workflow hands github.token to
# `gh run download`, which needs actions:read to resolve the CI run and
# fetch its artifact — and nothing more.
permissions:
  contents: read
  actions: read

jobs:

  # ── Resolve one crusher binary for the whole Firebird pair ──
  #
  # T3. The pair's entire method is "two runs differing in the driver and
  # nothing else". `run-crusher` resolves the latest successful master CI run
  # by itself, which is right for an ordinary driver job and wrong here: two
  # jobs resolving independently can land either side of a merge, and then the
  # diff between their reports is measuring a driver change *and* a probe-suite
  # change with no way to separate them. Nothing warned; the two reports looked
  # exactly as comparable as a good pair.
  #
  # This job resolves once and both halves take the answer, so the guarantee is
  # structural rather than a matter of dispatching them close together. It runs
  # for `all` and for any `firebird-*` selection, and costs one ubuntu job.
  resolve-crusher:
    if: ${{ (inputs.driver || 'all') == 'all' || startsWith(inputs.driver, 'firebird-') }}
    name: Resolve crusher build for the pair
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.resolve.outputs.run-id }}
    steps:
    - name: Resolve latest successful master CI run
      id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Same query as the composite's, deliberately: this is that step
        # hoisted, not a second opinion. Recent gh CLI versions silently drop
        # `--status success` here (they filter on `status`, not `conclusion`),
        # so the selection is done in jq.
        RUN_ID=$(gh run list --workflow ci.yml --branch master --limit 10 \
          --repo "${{ github.repository }}" \
          --json databaseId,conclusion \
          -q '[.[] | select(.conclusion == "success")] | .[0].databaseId')
        if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
          echo "::error::No successful master CI run found — cannot fetch a crusher binary. Wait for a green ci.yml on master, then re-run stress-test."
          exit 1
        fi
        echo "Both halves of the pair will use crusher from CI run $RUN_ID"
        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  # ── PostgreSQL on Linux ─────────────────────────────────────
  # Driver / version / source: see `.github/drivers.json` → drivers.postgresql
  # (manifest is authoritative; the inline values below are pulled from it).
  postgresql:
    if: ${{ (inputs.driver || 'all') == 'all' || inputs.driver == 'postgresql' }}
    name: PostgreSQL (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Load driver metadata from .github/drivers.json
      run: |
        APT_VERSION=$(jq -er '.drivers.postgresql.install.apt_version' .github/drivers.json)
        DRIVER_VERSION=$(jq -er '.drivers.postgresql.version' .github/drivers.json)
        CONN=$(jq -er '.drivers.postgresql.conn_string' .github/drivers.json)
        {
          echo "APT_VERSION=$APT_VERSION"
          echo "DRIVER_VERSION=$DRIVER_VERSION"
          echo "CONN_STRING=$CONN"
        } >> "$GITHUB_ENV"

    - name: Install unixODBC + start PostgreSQL + install driver (pinned)
      run: |
        sudo apt-get update -y -q
        sudo apt-get install -y -q unixodbc unixodbc-dev odbcinst
        sudo systemctl start postgresql
        sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres'"
        # Pinned via .github/drivers.json — install fails loudly if Ubuntu's
        # repo drops this exact version, signalling the manifest needs updating.
        sudo apt-get install -y -q "odbc-postgresql=${APT_VERSION}"
        dpkg -s odbc-postgresql | grep Version
        cat /etc/odbcinst.ini

    - name: Record actual installed version (provenance for triage)
      run: |
        INSTALLED=$(dpkg -s odbc-postgresql | awk '/^Version:/ {print $2}')
        echo "$INSTALLED" > actual_version.txt
        if [ "$INSTALLED" != "$APT_VERSION" ]; then
          echo "::error::Installed odbc-postgresql=$INSTALLED but manifest pinned $APT_VERSION"
          exit 1
        fi

    - uses: ./.github/actions/run-crusher
      with:
        artifact-name: postgresql
        conn-string: ${{ env.CONN_STRING }}

  # ── MariaDB on Linux ────────────────────────────────────────
  # Driver / version / source: see `.github/drivers.json` → drivers.mariadb
  mariadb:
    if: ${{ (inputs.driver || 'all') == 'all' || inputs.driver == 'mariadb' }}
    name: MariaDB (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Load driver metadata from .github/drivers.json
      run: |
        APT_VERSION=$(jq -er '.drivers.mariadb.install.apt_version' .github/drivers.json)
        DRIVER_VERSION=$(jq -er '.drivers.mariadb.version' .github/drivers.json)
        CONN=$(jq -er '.drivers.mariadb.conn_string' .github/drivers.json)
        {
          echo "APT_VERSION=$APT_VERSION"
          echo "DRIVER_VERSION=$DRIVER_VERSION"
          echo "CONN_STRING=$CONN"
        } >> "$GITHUB_ENV"

    - name: Install unixODBC + MariaDB server + driver (pinned)
      run: |
        sudo apt-get update -y -q
        sudo apt-get install -y -q unixodbc unixodbc-dev odbcinst mariadb-server
        sudo apt-get install -y -q "odbc-mariadb=${APT_VERSION}"
        sudo systemctl start mariadb
        sudo mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'root';"
        dpkg -s odbc-mariadb | grep Version
        cat /etc/odbcinst.ini

    - name: Record actual installed version (provenance for triage)
      run: |
        INSTALLED=$(dpkg -s odbc-mariadb | awk '/^Version:/ {print $2}')
        echo "$INSTALLED" > actual_version.txt
        if [ "$INSTALLED" != "$APT_VERSION" ]; then
          echo "::error::Installed odbc-mariadb=$INSTALLED but manifest pinned $APT_VERSION"
          exit 1
        fi

    - uses: ./.github/actions/run-crusher
      with:
        artifact-name: mariadb
        conn-string: ${{ env.CONN_STRING }}

  # ── MySQL on Linux ──────────────────────────────────────────
  # Driver / version / source: see `.github/drivers.json` → drivers.mysql
  mysql:
    if: ${{ (inputs.driver || 'all') == 'all' || inputs.driver == 'mysql' }}
    name: MySQL (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Load driver metadata from .github/drivers.json
      run: |
        DRIVER_VERSION=$(jq -er '.drivers.mysql.version' .github/drivers.json)
        DRIVER_URL=$(jq -er '.drivers.mysql.install.url' .github/drivers.json)
        DRIVER_LIB=$(jq -er '.drivers.mysql.install.library_name' .github/drivers.json)
        DRIVER_SECTION=$(jq -er '.drivers.mysql.install.driver_section' .github/drivers.json)
        CONN=$(jq -er '.drivers.mysql.conn_string' .github/drivers.json)
        {
          echo "DRIVER_VERSION=$DRIVER_VERSION"
          echo "DRIVER_URL=$DRIVER_URL"
          echo "DRIVER_LIB_NAME=$DRIVER_LIB"
          echo "DRIVER_SECTION=$DRIVER_SECTION"
          echo "CONN_STRING=$CONN"
        } >> "$GITHUB_ENV"

    - name: Install unixODBC + start MySQL + install MySQL ODBC driver
      run: |
        sudo apt-get update -y -q
        sudo apt-get install -y -q unixodbc unixodbc-dev odbcinst
        sudo systemctl start mysql
        # On Ubuntu 24.04, MySQL 8.4+ uses caching_sha2_password by default
        sudo mysql --defaults-file=/etc/mysql/debian.cnf -e "CREATE USER 'crusher'@'%' IDENTIFIED BY 'crusher'; GRANT ALL ON *.* TO 'crusher'@'%'; FLUSH PRIVILEGES;"
        mysql -u crusher -pcrusher -e "SELECT VERSION();"

        curl --no-progress-meter -LO "${DRIVER_URL}"
        tar xzf mysql-connector-odbc-*.tar.gz
        DRIVER_DIR=$(ls -d mysql-connector-odbc-*/lib/)
        DRIVER_PATH=$(readlink -f "${DRIVER_DIR}/${DRIVER_LIB_NAME}")
        echo "MySQL ODBC driver ${DRIVER_VERSION}: ${DRIVER_PATH}"
        {
          echo "[${DRIVER_SECTION}]"
          echo "Description = MySQL ODBC Unicode Driver"
          echo "Driver = ${DRIVER_PATH}"
        } | sudo tee -a /etc/odbcinst.ini
        cat /etc/odbcinst.ini
        # Persist the driver dir for the run step to extend LD_LIBRARY_PATH.
        echo "MYSQL_DRIVER_LIB=$(readlink -f "$DRIVER_DIR")" >> "$GITHUB_ENV"

    - name: Record actual installed version (provenance for triage)
      run: |
        # The MySQL tarball name embeds the version — extract from the dir.
        # Uses a shell glob (not `ls`) per shellcheck SC2012.
        shopt -s nullglob
        DIRS=( mysql-connector-odbc-*/ )
        if [ ${#DIRS[@]} -eq 0 ]; then
          echo "::error::No mysql-connector-odbc-*/ directory after extraction"
          exit 1
        fi
        INSTALLED_DIR="${DIRS[0]}"
        INSTALLED=$(echo "$INSTALLED_DIR" | sed -E 's|^mysql-connector-odbc-||; s|-linux-.*||; s|/$||')
        echo "$INSTALLED" > actual_version.txt
        if [ "$INSTALLED" != "$DRIVER_VERSION" ]; then
          echo "::error::Downloaded mysql-connector-odbc=$INSTALLED but manifest pinned $DRIVER_VERSION"
          exit 1
        fi

    - uses: ./.github/actions/run-crusher
      with:
        artifact-name: mysql
        conn-string: ${{ env.CONN_STRING }}
        ld-library-path: ${{ env.MYSQL_DRIVER_LIB }}

  # ── DuckDB on Linux ─────────────────────────────────────────
  # Driver / version / source: see `.github/drivers.json` → drivers.duckdb
  duckdb:
    if: ${{ (inputs.driver || 'all') == 'all' || inputs.driver == 'duckdb' }}
    name: DuckDB (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Load driver metadata from .github/drivers.json
      run: |
        DRIVER_VERSION=$(jq -er '.drivers.duckdb.version' .github/drivers.json)
        DRIVER_URL=$(jq -er '.drivers.duckdb.install.url' .github/drivers.json)
        DRIVER_LIB=$(jq -er '.drivers.duckdb.install.library_name' .github/drivers.json)
        DRIVER_SECTION=$(jq -er '.drivers.duckdb.install.driver_section' .github/drivers.json)
        CONN=$(jq -er '.drivers.duckdb.conn_string' .github/drivers.json)
        {
          echo "DRIVER_VERSION=$DRIVER_VERSION"
          echo "DRIVER_URL=$DRIVER_URL"
          echo "DRIVER_LIB_NAME=$DRIVER_LIB"
          echo "DRIVER_SECTION=$DRIVER_SECTION"
          echo "CONN_STRING=$CONN"
        } >> "$GITHUB_ENV"

    - name: Install unixODBC + DuckDB ODBC driver
      run: |
        sudo apt-get update -y -q
        sudo apt-get install -y -q unixodbc unixodbc-dev odbcinst

        mkdir duckdb_odbc
        cd duckdb_odbc
        curl --no-progress-meter -LO "${DRIVER_URL}"
        unzip -q duckdb_odbc-linux-amd64.zip
        DRIVER_PATH=$(readlink -f "${DRIVER_LIB_NAME}")
        cd ..
        echo "DuckDB ODBC driver ${DRIVER_VERSION}: ${DRIVER_PATH}"
        {
          echo "[${DRIVER_SECTION}]"
          echo "Description = DuckDB ODBC Driver"
          echo "Driver = ${DRIVER_PATH}"
        } | sudo tee -a /etc/odbcinst.ini
        cat /etc/odbcinst.ini
        echo "DUCKDB_DRIVER_LIB=$(readlink -f duckdb_odbc)" >> "$GITHUB_ENV"

    - name: Record actual installed version (provenance for triage)
      run: |
        # DuckDB ships only the .so without an embedded version string we
        # can extract reliably; trust the manifest pin (the URL is exact).
        # Record the manifest version verbatim so the triage skill has
        # something to compare against driver_info.driver_version.
        echo "$DRIVER_VERSION" > actual_version.txt

    - uses: ./.github/actions/run-crusher
      with:
        artifact-name: duckdb
        conn-string: ${{ env.CONN_STRING }}
        ld-library-path: ${{ env.DUCKDB_DRIVER_LIB }}

  # ── ClickHouse on Linux ─────────────────────────────────────
  # Driver / version / source: see `.github/drivers.json` → drivers.clickhouse
  # (Server brought up via ClickHouse's deb repo; only the driver version is
  # part of the triage provenance contract.)
  clickhouse:
    if: ${{ (inputs.driver || 'all') == 'all' || inputs.driver == 'clickhouse' }}
    name: ClickHouse (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Load driver metadata from .github/drivers.json
      run: |
        DRIVER_VERSION=$(jq -er '.drivers.clickhouse.version' .github/drivers.json)
        DRIVER_URL=$(jq -er '.drivers.clickhouse.install.url' .github/drivers.json)
        DRIVER_LIB=$(jq -er '.drivers.clickhouse.install.library_name' .github/drivers.json)
        DRIVER_SECTION=$(jq -er '.drivers.clickhouse.install.driver_section' .github/drivers.json)
        CONN=$(jq -er '.drivers.clickhouse.conn_string' .github/drivers.json)
        {
          echo "DRIVER_VERSION=$DRIVER_VERSION"
          echo "DRIVER_URL=$DRIVER_URL"
          echo "DRIVER_LIB_NAME=$DRIVER_LIB"
          echo "DRIVER_SECTION=$DRIVER_SECTION"
          echo "CONN_STRING=$CONN"
        } >> "$GITHUB_ENV"

    - name: Install unixODBC + start ClickHouse + install driver
      run: |
        sudo apt-get update -y -q
        sudo apt-get install -y -q unixodbc unixodbc-dev odbcinst

        curl --no-progress-meter -fsSL 'https://packages.clickhouse.com/rpm/stable/repodata/repomd.xml.key' | sudo gpg --dearmor -o /usr/share/keyrings/clickhouse-keyring.gpg
        ARCH=$(dpkg --print-architecture)
        echo "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg arch=${ARCH}] https://packages.clickhouse.com/deb stable main" | sudo tee /etc/apt/sources.list.d/clickhouse.list
        sudo apt-get update -y -q
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q clickhouse-server
        sudo systemctl start clickhouse-server

        curl --no-progress-meter -LO "${DRIVER_URL}"
        unzip clickhouse-odbc-linux-Clang-UnixODBC-Release.zip
        tar xJf "clickhouse-odbc-${DRIVER_VERSION}-Linux.tar.xz"
        DRIVER_PATH=$(readlink -f "clickhouse-odbc-${DRIVER_VERSION}-Linux/lib/${DRIVER_LIB_NAME}")
        echo "ClickHouse ODBC driver ${DRIVER_VERSION}: ${DRIVER_PATH}"
        {
          echo "[${DRIVER_SECTION}]"
          echo "Description = ClickHouse ODBC Unicode Driver"
          echo "Driver = ${DRIVER_PATH}"
        } | sudo tee -a /etc/odbcinst.ini
        cat /etc/odbcinst.ini
        echo "CLICKHOUSE_DRIVER_LIB=$(readlink -f "clickhouse-odbc-${DRIVER_VERSION}-Linux/lib")" >> "$GITHUB_ENV"

    - name: Record actual installed version (provenance for triage)
      run: |
        # The release URL pins the exact tag; record the manifest version
        # verbatim so the triage skill has a stable comparison anchor.
        echo "$DRIVER_VERSION" > actual_version.txt

    - uses: ./.github/actions/run-crusher
      with:
        artifact-name: clickhouse
        conn-string: ${{ env.CONN_STRING }}
        ld-library-path: ${{ env.CLICKHOUSE_DRIVER_LIB }}

  # ── Firebird on Linux ───────────────────────────────────────
  # Driver / version / source: see `.github/drivers.json` → drivers.firebird
  # Server brought up via PSFirebird (PowerShell module that vendors
  # Firebird binaries) on port 3050 with SYSDBA/masterkey.
  firebird:
    if: ${{ (inputs.driver || 'all') == 'all' || inputs.driver == 'firebird' }}
    name: Firebird (Linux)
    # Pinned to ubuntu-22.04 (jammy) to match PSFirebird's own example
    # workflow + the parent firebird-odbc-driver-v4 CI. ubuntu-24.04
    # (noble) lacks libncurses5 in its repos and exhibits other quirks
    # with PSFirebird's release-resolution path.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Load driver metadata from .github/drivers.json
      run: |
        DRIVER_VERSION=$(jq -er '.drivers.firebird.version' .github/drivers.json)
        DRIVER_URL=$(jq -er '.drivers.firebird.install.url' .github/drivers.json)
        DRIVER_LIB=$(jq -er '.drivers.firebird.install.library_name' .github/drivers.json)
        DRIVER_SECTION=$(jq -er '.drivers.firebird.install.driver_section' .github/drivers.json)
        CONN=$(jq -er '.drivers.firebird.conn_string' .github/drivers.json)
        {
          echo "DRIVER_VERSION=$DRIVER_VERSION"
          echo "DRIVER_URL=$DRIVER_URL"
          echo "DRIVER_LIB_NAME=$DRIVER_LIB"
          echo "DRIVER_SECTION=$DRIVER_SECTION"
          echo "CONN_STRING=$CONN"
        } >> "$GITHUB_ENV"

    - name: Install unixODBC
      run: |
        sudo apt-get update -y -q
        sudo apt-get install -y -q unixodbc unixodbc-dev odbcinst

    - name: Bring up Firebird via PSFirebird (5.0.3 on port 3050)
      shell: pwsh
      # PSFirebird's Get-FirebirdReleaseUrl uses GITHUB_TOKEN to authenticate
      # against the GitHub API (5000 req/hr) — without it, repeated stress-test
      # runs hit the 60 req/hr unauthenticated cap and fail with "Could not
      # find Firebird release for version X on GitHub."
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        Install-Module -Name PSFirebird -Force -Scope CurrentUser
        Import-Module PSFirebird

        # Stage Firebird 5.0.3 under a stable path so subsequent steps
        # can compute LD_LIBRARY_PATH for libfbclient.so. Retry up to 3x —
        # PSFirebird's GitHub API release lookup is intermittently flaky on
        # GitHub-hosted runners (returns an empty/stale release list and
        # Where-Object filters everything out, surfacing as "Could not find
        # Firebird release for version 5.0.3 on GitHub").
        $fb = $null
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          try {
            $fb = New-FirebirdEnvironment -Version '5.0.3' -Path '/tmp/firebird5' -Force
            break
          } catch {
            Write-Host "PSFirebird setup attempt $attempt failed: $_"
            if ($attempt -lt 3) {
              Remove-Item -Recurse -Force '/tmp/firebird5' -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 15
            } else { throw }
          }
        }

        # TCP connections need SYSDBA's password set in the security db.
        # Authenticate as SYSDBA up-front so the embedded isql call has
        # CREATE-TABLE permission against security5.fdb (the SRP plugin
        # initialises its PLG$SRP table on first user write). Firebird's
        # tarball ships security5.fdb with SYSDBA/masterkey pre-defined;
        # PSFirebird's own Tests/FirebirdInstance.Tests.ps1 follows this
        # exact pattern.
        $env:ISC_USER = 'SYSDBA'
        $env:ISC_PASSWORD = 'masterkey'

        $db = New-FirebirdDatabase -Database '/tmp/crusher.fdb' -Environment $fb
        "CREATE OR ALTER USER SYSDBA PASSWORD 'masterkey';" |
          Invoke-FirebirdIsql -Database $db -Environment $fb

        # R1 (IMPROVEMENT_PLAN_V2): the same permanent fixture the Windows
        # composite seeds — see .github/actions/firebird-windows/action.yml for
        # why it exists and why it has an index and a foreign key. Kept in step
        # with that copy by hand; the two jobs must agree or the linux and
        # windows reports stop being comparable.
        #
        # An array joined with newlines, not a here-string: PowerShell wants the
        # closing `'@` at column 0, and that would end this YAML block scalar.
        $fixture = @(
          "CREATE TABLE CRUSHER_FIXTURE_PARENT ("
          "    ID    INTEGER NOT NULL PRIMARY KEY,"
          "    LABEL VARCHAR(50));"
          "CREATE TABLE CRUSHER_FIXTURE ("
          "    ID        INTEGER NOT NULL PRIMARY KEY,"
          "    PARENT_ID INTEGER,"
          "    NAME      VARCHAR(50),"
          "    CONSTRAINT FK_CRUSHER_FIXTURE_PARENT"
          "        FOREIGN KEY (PARENT_ID) REFERENCES CRUSHER_FIXTURE_PARENT (ID));"
          "CREATE INDEX IDX_CRUSHER_FIXTURE_NAME ON CRUSHER_FIXTURE (NAME);"
          "COMMIT;"
          "INSERT INTO CRUSHER_FIXTURE_PARENT (ID, LABEL) VALUES (1, 'parent one');"
          "INSERT INTO CRUSHER_FIXTURE_PARENT (ID, LABEL) VALUES (2, 'parent two');"
          "INSERT INTO CRUSHER_FIXTURE (ID, PARENT_ID, NAME) VALUES (1, 1, 'row one');"
          "INSERT INTO CRUSHER_FIXTURE (ID, PARENT_ID, NAME) VALUES (2, 1, 'row two');"
          "INSERT INTO CRUSHER_FIXTURE (ID, PARENT_ID, NAME) VALUES (3, NULL, 'orphan');"
          "COMMIT;"
          "SET TERM ^ ;"
          "CREATE PROCEDURE CRUSHER_PROC (IN_N INTEGER, IN_S VARCHAR(64))"
          "RETURNS (OUT_N INTEGER, OUT_S VARCHAR(64)) AS"
          "BEGIN OUT_N = IN_N * 2; OUT_S = IN_S || '-out'; END^"
          "CREATE PROCEDURE CRUSHER_FUNC (A INTEGER, B INTEGER)"
          "RETURNS (RESULT INTEGER) AS"
          "BEGIN RESULT = A * 10 + B; END^"
          "SET TERM ; ^"
          "COMMIT;"
        ) -join "`n"
        $fixture | Invoke-FirebirdIsql -Database $db -Environment $fb

        $seeded = 'SELECT COUNT(*) FROM CRUSHER_FIXTURE;' |
          Invoke-FirebirdIsql -Database $db -Environment $fb
        Write-Host "Fixture rows: $seeded"
        if ("$seeded" -notmatch '3') {
          throw "CRUSHER_FIXTURE was not seeded; the catalog probes would skip"
        }

        $instance = Start-FirebirdInstance -Port 3050 -Environment $fb
        Write-Host "Firebird PID: $($instance.Process.Id)  Port: $($instance.Port)"

        # Expose the Firebird lib dir to the next step so libOdbcFb.so
        # can dlopen libfbclient.so at connect time. PSFirebird stages
        # libfbclient under <env>/lib (Linux); fall back to a glob just
        # in case the layout shifts in a future PSFirebird release.
        $libDir = if (Test-Path "$($fb.Path)/lib/libfbclient.so") {
          "$($fb.Path)/lib"
        } else {
          (Get-ChildItem -Path $fb.Path -Recurse -Filter 'libfbclient.so*' |
            Select-Object -First 1).Directory.FullName
        }
        if (-not $libDir) { throw "Could not locate libfbclient.so under $($fb.Path)" }
        "FIREBIRD_LIB_DIR=$libDir" | Out-File -Append $env:GITHUB_ENV
        Write-Host "FIREBIRD_LIB_DIR=$libDir"

    - name: Smoke-test Firebird is listening on 3050
      run: |
        # Verify the detached firebird process is reachable before we
        # waste a 100-test crusher run on a connection-refused failure.
        for i in 1 2 3 4 5; do
          if ss -ltn | grep -q ':3050'; then
            echo "Firebird is listening on 3050 (attempt $i)"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Firebird not listening on 3050 after 5s"
        ss -ltn || true
        exit 1

    - name: Install Firebird ODBC driver (download + register)
      run: |
        mkdir firebird_odbc
        cd firebird_odbc
        curl --no-progress-meter -LO "${DRIVER_URL}"
        tar xzf firebird-odbc-driver-*-linux-x64.tar.gz
        DRIVER_PATH=$(readlink -f "${DRIVER_LIB_NAME}")
        cd ..
        echo "Firebird ODBC driver ${DRIVER_VERSION}: ${DRIVER_PATH}"
        {
          echo "[${DRIVER_SECTION}]"
          echo "Description = Firebird ODBC Driver"
          echo "Driver = ${DRIVER_PATH}"
          echo "Setup = ${DRIVER_PATH}"
          echo "FileUsage = 1"
        } | sudo tee -a /etc/odbcinst.ini
        cat /etc/odbcinst.ini

    - name: Record actual installed version (provenance for triage)
      run: |
        # The release URL pins the exact tag; the .tar.gz has no version
        # string we can extract reliably. Record the manifest version
        # verbatim — same convention as duckdb / clickhouse jobs.
        echo "$DRIVER_VERSION" > actual_version.txt

    - uses: ./.github/actions/run-crusher
      with:
        artifact-name: firebird
        conn-string: ${{ env.CONN_STRING }}
        ld-library-path: ${{ env.FIREBIRD_LIB_DIR }}

  # ── Firebird 3.0.1.21 (official) on Windows ─────────────────
  # Driver / version / source: see `.github/drivers.json` → drivers["firebird-official"]
  #
  # H17. This job and `firebird-patched` below are a *pair*: same runner image,
  # same PSFirebird server, same database path, same connection string, same
  # crusher binary. Only the install step differs. That is what makes the two
  # reports subtractable — a probe that fails here and passes there is evidence
  # about the driver, and nothing else.
  #
  # Windows rather than Linux because there is no choice: the official 3.0.x
  # line is distributed as Inno Setup installers and the repack publishes two
  # .exe assets per tag. Both installers register the driver under the same
  # name ("Firebird ODBC Driver"), so the two builds cannot coexist on one
  # machine — hence two jobs rather than a matrix.
  firebird-official:
    if: ${{ (inputs.driver || 'all') == 'all' || inputs.driver == 'firebird-official' || inputs.driver == 'firebird-pair' }}
    # T3: both halves take their crusher binary from one resolution,
    # so the two reports are provably built by the same probe suite.
    needs: resolve-crusher
    name: Firebird 3.0.1.21 official (Windows)
    # Pinned to windows-2022 to match the driver project's own CI matrix, which
    # is where this Firebird-on-Windows recipe is already exercised daily.
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Load driver metadata from .github/drivers.json
      shell: bash
      run: |
        # `--arg k` rather than a literal path: the key contains a hyphen, which
        # jq would read as subtraction in the bare `.drivers.firebird-official`
        # form.
        K='firebird-official'
        {
          echo "DRIVER_VERSION=$(jq -er --arg k "$K" '.drivers[$k].version'                .github/drivers.json)"
          echo "DRIVER_URL=$(jq -er --arg k "$K" '.drivers[$k].install.url'                .github/drivers.json)"
          echo "DRIVER_SHA256=$(jq -er --arg k "$K" '.drivers[$k].install.sha256'          .github/drivers.json)"
          echo "DRIVER_SECTION=$(jq -er --arg k "$K" '.drivers[$k].install.driver_section' .github/drivers.json)"
          echo "CONN_STRING=$(jq -er --arg k "$K" '.drivers[$k].conn_string'               .github/drivers.json)"
        } >> "$GITHUB_ENV"

    - uses: ./.github/actions/firebird-windows

    - name: Install the official ODBC driver (Inno Setup, silent)
      shell: pwsh
      run: |
        $exe = Join-Path $env:RUNNER_TEMP 'firebird-odbc-setup.exe'
        curl.exe --no-progress-meter -L -o $exe $env:DRIVER_URL

        # The digest is the real pin. A version resource cannot tell a re-cut
        # release asset from the one that was triaged, so failing here is
        # cheaper than publishing a report about a binary nobody can identify.
        $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
        if ($got -ne $env:DRIVER_SHA256) {
          Write-Host "::error::$env:DRIVER_URL has sha256 $got but the manifest pins $env:DRIVER_SHA256"
          exit 1
        }

        # No /TYPE=: the default is DeveloperInstall, the setup type that puts
        # FirebirdODBC.dll in System32 and registers it. Registration is the
        # DLL's own DllRegisterServer (the .iss marks the file `Flags:
        # regserver`), so there is no [Registry] section to override.
        $p = Start-Process -FilePath $exe `
                           -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' `
                           -Wait -PassThru
        Write-Host "installer exit code: $($p.ExitCode)"
        if ($p.ExitCode -ne 0) { exit $p.ExitCode }

    - name: Record actual installed version (provenance for triage)
      shell: pwsh
      run: |
        $dll = Join-Path $env:SystemRoot 'System32\FirebirdODBC.dll'
        if (-not (Test-Path $dll)) {
          Write-Host "::error::$dll is missing — the installer ran but placed no driver"
          exit 1
        }
        $key = "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\$env:DRIVER_SECTION"
        if (-not (Test-Path $key)) {
          Write-Host "::error::$key is missing — the driver did not register under the name the connection string uses"
          Get-ChildItem 'HKLM:\SOFTWARE\ODBC\ODBCINST.INI' | Select-Object -ExpandProperty PSChildName
          exit 1
        }
        Get-ItemProperty $key | Format-List

        # A genuine observation, unlike the linux firebird job's echo of the
        # manifest: the shipped DLL carries a VERSIONINFO resource. Whether it
        # agrees with the manifest is triage.ps1's call, not this job's — the
        # digest check above is the gate that belongs here.
        $installed = ($dll | Get-Item).VersionInfo.ProductVersion.Trim()
        [System.IO.File]::WriteAllText("$PWD/actual_version.txt", $installed)
        Write-Host "Installed FirebirdODBC.dll ProductVersion: $installed (manifest pins $env:DRIVER_VERSION)"

    - uses: ./.github/actions/run-crusher
      with:
        artifact-name: firebird-official
        conn-string: ${{ env.CONN_STRING }}
        crusher-run-id: ${{ needs.resolve-crusher.outputs.run-id }}

  # ── Firebird 3.5.1-rc2 (master + 13 PRs) on Windows ─────────
  # Driver / version / source: see `.github/drivers.json` → drivers["firebird-patched"]
  # The other half of the H17 pair; see firebird-official above for why the two
  # exist and why they are kept identical apart from this job's install step.
  firebird-patched:
    if: ${{ (inputs.driver || 'all') == 'all' || inputs.driver == 'firebird-patched' || inputs.driver == 'firebird-pair' }}
    # T3: both halves take their crusher binary from one resolution,
    # so the two reports are provably built by the same probe suite.
    needs: resolve-crusher
    name: Firebird 3.5.1-rc2 patched (Windows)
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Load driver metadata from .github/drivers.json
      shell: bash
      run: |
        K='firebird-patched'
        {
          echo "DRIVER_VERSION=$(jq -er --arg k "$K" '.drivers[$k].version'                .github/drivers.json)"
          echo "DRIVER_URL=$(jq -er --arg k "$K" '.drivers[$k].install.url'                .github/drivers.json)"
          echo "DRIVER_SHA256=$(jq -er --arg k "$K" '.drivers[$k].install.sha256'          .github/drivers.json)"
          echo "DRIVER_SECTION=$(jq -er --arg k "$K" '.drivers[$k].install.driver_section' .github/drivers.json)"
          echo "CONN_STRING=$(jq -er --arg k "$K" '.drivers[$k].conn_string'               .github/drivers.json)"
        } >> "$GITHUB_ENV"

    - uses: ./.github/actions/firebird-windows

    - name: Install the patched ODBC driver (MSI, silent)
      shell: pwsh
      run: |
        $msi = Join-Path $env:RUNNER_TEMP 'firebird-odbc.msi'
        curl.exe --no-progress-meter -L -o $msi $env:DRIVER_URL

        # See firebird-official: the digest matters more here, not less. The
        # MSI drops the prerelease suffix from ProductVersion, so rc1 and rc2
        # both install as 3.5.1.0 and this is the only check that can tell
        # which one was tested.
        $got = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
        if ($got -ne $env:DRIVER_SHA256) {
          Write-Host "::error::$env:DRIVER_URL has sha256 $got but the manifest pins $env:DRIVER_SHA256"
          exit 1
        }

        $log = Join-Path $env:RUNNER_TEMP 'msi.log'
        $p = Start-Process -FilePath 'msiexec.exe' `
                           -ArgumentList '/i',"`"$msi`"",'/qn','/norestart','/l*v',"`"$log`"" `
                           -Wait -PassThru
        Write-Host "msiexec exit code: $($p.ExitCode)"
        if ($p.ExitCode -ne 0) {
          if (Test-Path $log) { Get-Content $log -Tail 80 }
          exit $p.ExitCode
        }

    - name: Record actual installed version (provenance for triage)
      shell: pwsh
      run: |
        $dll = Join-Path $env:SystemRoot 'System32\FirebirdODBC.dll'
        if (-not (Test-Path $dll)) {
          Write-Host "::error::$dll is missing — the MSI ran but placed no driver"
          exit 1
        }
        $key = "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\$env:DRIVER_SECTION"
        if (-not (Test-Path $key)) {
          Write-Host "::error::$key is missing — the driver did not register under the name the connection string uses"
          Get-ChildItem 'HKLM:\SOFTWARE\ODBC\ODBCINST.INI' | Select-Object -ExpandProperty PSChildName
          exit 1
        }
        Get-ItemProperty $key | Format-List

        $installed = ($dll | Get-Item).VersionInfo.ProductVersion.Trim()
        [System.IO.File]::WriteAllText("$PWD/actual_version.txt", $installed)
        Write-Host "Installed FirebirdODBC.dll ProductVersion: $installed (manifest pins $env:DRIVER_VERSION)"

    - uses: ./.github/actions/run-crusher
      with:
        artifact-name: firebird-patched
        conn-string: ${{ env.CONN_STRING }}
        crusher-run-id: ${{ needs.resolve-crusher.outputs.run-id }}

  # ── Mock Driver on Windows ──────────────────────────────────
  # Driver / conn-string: see `.github/drivers.json` → drivers["mock-driver"]
  # The mock's "source" is this repo's mock-driver/ directory — the triage
  # skill special-cases it (no clone step).
  mock-driver:
    if: ${{ (inputs.driver || 'all') == 'all' || inputs.driver == 'mock-driver' }}
    name: Mock Driver (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Load driver metadata from .github/drivers.json
      shell: bash
      run: |
        CONN=$(jq -er '.drivers["mock-driver"].conn_string' .github/drivers.json)
        echo "CONN_STRING=$CONN" >> "$GITHUB_ENV"

    - name: Resolve latest master CI run (mock + crusher source)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Same resolution as run-crusher composite, but we need the run ID
        # earlier so we can also pull the mock driver from this run. The
        # composite re-resolves it later — that's fine, both will pick the
        # same run since master moves forward only between calls.
        # `gh run list --status success` was unreliable across recent gh CLI
        # versions; filter on `conclusion` via jq instead. (See §7.6.)
        RUN_ID=$(gh run list --workflow ci.yml --branch master --limit 10 \
          --json databaseId,conclusion \
          -q '[.[] | select(.conclusion == "success")] | .[0].databaseId')
        if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
          echo "::error::No successful master CI run found — cannot fetch mock-driver build."
          exit 1
        fi
        echo "MASTER_CI_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

    - name: Download mock driver from master CI run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # Extract into a sibling staging dir, not mock-driver/, because
      # actions/checkout already populated mock-driver/install/register.ps1
      # — gh run download refuses to overwrite and exits 1. Mirrors the
      # mock-driver-artifact/ layout used by ci.yml's build-and-test job.
      run: |
        gh run download "$MASTER_CI_RUN_ID" --repo "${{ github.repository }}" \
          -n mock-odbc-driver-Windows-Release -D mock-driver-artifact
        ls -la mock-driver-artifact/build/Release/

    - name: Register Mock Driver
      shell: pwsh
      run: |
        $driverDest = "C:\Windows\System32\mockodbc.dll"
        Copy-Item mock-driver-artifact/build/Release/mockodbc.dll -Destination $driverDest
        & mock-driver-artifact/install/register.ps1 -DriverPath $driverDest

    - name: Record actual installed version (provenance for triage)
      shell: bash
      run: |
        # Mock driver tracks master HEAD now (PORT plan §7.5). Record the
        # short SHA of the run's commit so the triage skill knows which
        # workspace state to diff against.
        SHA=$(gh run view "$MASTER_CI_RUN_ID" --repo "${{ github.repository }}" \
          --json headSha -q '.headSha' | cut -c1-12)
        echo "${SHA:-unknown}" > actual_version.txt
      env:
        GH_TOKEN: ${{ github.token }}

    - uses: ./.github/actions/run-crusher
      with:
        artifact-name: mock-driver
        conn-string: ${{ env.CONN_STRING }}
