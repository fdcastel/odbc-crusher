name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same branch — pushing N commits to a PR
# no longer queues N full matrix runs. Skip cancellation on push to
# main/master so a release-tag-adjacent run isn't killed mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pre-flight: lint every workflow YAML before burning a full matrix
  # of CI minutes on a typo. Catches the kinds of mistakes the §6 cycle
  # iterated on for half a dozen commits (sudoers PATH stripping,
  # mistyped artifact paths, shell quoting in heredocs, etc.).
  # Fast (<10s); the matrix jobs depend on it so bad YAML short-circuits.
  lint:
    timeout-minutes: 10
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install actionlint
      run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
    - name: Run actionlint
      run: ./actionlint -color

  build-mock-driver:
    timeout-minutes: 30
    name: Build Mock ODBC Driver on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Linux pinned to ubuntu-22.04 (jammy) so the produced .so runs
        # forward-compatibly on both jammy and noble runners. ubuntu-latest
        # (noble, glibc 2.39 / libstdc++ GLIBCXX_3.4.32) emits binaries
        # that won't load on jammy — and PSFirebird only works on jammy
        # (§7.6 firebird stress-test depends on this).
        os: [ubuntu-22.04, windows-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Install ODBC dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc unixodbc-dev

    - name: Install ODBC dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install unixodbc

    - name: Cache CMake FetchContent (_deps)
      # Skip the GoogleTest re-clone on every CI run. Key is per-OS + the
      # shared version pin in cmake/Dependencies.cmake (E3) plus the mock's
      # own CMakeLists — bumping either busts the cache automatically.
      uses: actions/cache@v4
      with:
        path: mock-driver/build/_deps
        key: cmake-deps-mock-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'mock-driver/CMakeLists.txt') }}

    - name: Configure Mock Driver
      run: cmake -B mock-driver/build -S mock-driver -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build Mock Driver
      run: cmake --build mock-driver/build --config ${{ matrix.build_type }} -j 4

    - name: Check mockodbc.def export drift (both directions)
      # IMPROVEMENT_PLAN.md F11. The .def is a Windows-only linker artifact,
      # but this check is pure text — it runs on Windows Release only to avoid
      # doing the same work six times across the matrix.
      #
      # This used to check one direction only (.def -> source), which is
      # exactly why the 38-symbol export asymmetry in D2 went unnoticed for
      # the life of the project. It now asserts both, against an explicit
      # list of symbols that are implemented but deliberately unexported.
      if: runner.os == 'Windows' && matrix.build_type == 'Release'
      shell: pwsh
      run: |
        $defFile     = "mock-driver/src/mockodbc.def"
        $allowFile   = "mock-driver/src/mockodbc.not-exported.txt"

        # Exports: every non-comment line inside the file that is a bare
        # symbol name. The old pattern required exactly four leading spaces,
        # so a reformatted .def would have quietly checked fewer symbols.
        $exports = Get-Content $defFile |
            ForEach-Object { ($_ -replace ';.*$', '').Trim() } |
            Where-Object { $_ -match '^SQL[A-Za-z0-9]+$' } |
            Sort-Object -Unique

        if ($exports.Count -lt 50) {
            Write-Error "Only $($exports.Count) exports parsed from $defFile — the extraction is broken, not the .def."
            exit 1
        }

        # Symbols implemented (or forward-declared) under src/.
        $sources = (Get-ChildItem mock-driver/src -Filter *.cpp -Recurse |
            Get-Content -Raw) -join "`n"
        $defined = [regex]::Matches($sources, 'SQLRETURN\s+SQL_API\s+([A-Za-z0-9_]+)\s*\(') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique

        # Deliberately-unexported symbols.
        $allowed = Get-Content $allowFile |
            ForEach-Object { ($_ -replace '#.*$', '').Trim() } |
            Where-Object { $_ -ne '' } |
            Sort-Object -Unique

        $failed = $false

        # (1) .def -> source: an export with no implementation fails to link.
        $missing = $exports | Where-Object { $defined -notcontains $_ }
        if ($missing) {
            Write-Output "::error::mockodbc.def exports with no implementation under src/: $($missing -join ', ')"
            $failed = $true
        }

        # (2) source -> .def: an implemented entry point that is neither
        # exported nor explicitly sanctioned as internal. This is the
        # direction that was missing.
        $unlisted = $defined | Where-Object { $exports -notcontains $_ -and $allowed -notcontains $_ }
        if ($unlisted) {
            Write-Output "::error::SQL_API symbols under src/ that are neither exported nor listed in $($allowFile): $($unlisted -join ', ')"
            Write-Output "Add them to mockodbc.def if they are part of the driver's interface, or to $allowFile if they are not."
            $failed = $true
        }

        # (3) the allow-list itself cannot go stale.
        $both = $allowed | Where-Object { $exports -contains $_ }
        if ($both) {
            Write-Output "::error::listed as not-exported but present in mockodbc.def EXPORTS: $($both -join ', ')"
            $failed = $true
        }
        $ghost = $allowed | Where-Object { $defined -notcontains $_ }
        if ($ghost) {
            Write-Output "::error::listed in $($allowFile) but no longer implemented under src/: $($ghost -join ', ')"
            $failed = $true
        }

        if ($failed) { exit 1 }
        Write-Host "Export surface consistent: $($exports.Count) exported, $($allowed.Count) deliberately internal, $($defined.Count) implemented."

    - name: Check every SQL_API entry point has the exception barrier
      # IMPROVEMENT_PLAN.md D9. A C++ exception unwinding out of an entry
      # point, across the C ABI into the Driver Manager, terminates the host
      # process. Every definition is wrapped in a function-try-block via
      # MOCK_ENTRY_TRY / MOCK_ENTRY_CATCH (driver/entry_guard.hpp).
      #
      # This is a property of the source text rather than of the running
      # driver, so it sits here alongside the .def drift check; the handler's
      # behaviour is covered by test_entry_guard.cpp. One matrix slot is
      # enough — it is pure text and platform-independent.
      if: runner.os == 'Linux' && matrix.build_type == 'Release'
      run: python3 mock-driver/tools/check_entry_guards.py

    - name: Run Mock Driver Tests
      run: ctest --test-dir mock-driver/build -C ${{ matrix.build_type }} --output-on-failure --timeout 300

    - name: Upload Mock Driver Artifacts
      uses: actions/upload-artifact@v4
      if: matrix.build_type == 'Release'
      with:
        name: mock-odbc-driver-${{ runner.os }}-${{ matrix.build_type }}
        # Glob every possible binary name across the three platforms so
        # this list doesn't need a per-OS branch. upload-artifact ignores
        # missing matches when at least one path resolves.
        path: |
          mock-driver/build/**/mockodbc.dll
          mock-driver/build/**/mockodbc.lib
          mock-driver/build/**/libmockodbc.so
          mock-driver/build/**/libmockodbc.dylib
          mock-driver/install/register.ps1
          mock-driver/install/register.sh

  build-and-test:
    timeout-minutes: 45
    name: Build and Test ODBC Crusher on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-mock-driver  # Run after mock driver builds
    strategy:
      fail-fast: false
      matrix:
        # See build-mock-driver above — Linux pinned to jammy for
        # forward-compatible binaries. The downloaded mock-driver artifact
        # name (mock-odbc-driver-Linux-Release) doesn't carry the runner
        # version, so the matrix slot here MUST match the build-mock-driver
        # slot to avoid a glibc-version mismatch when loading the .so.
        os: [ubuntu-22.04, windows-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Install ODBC dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc unixodbc-dev

    - name: Install ODBC dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install unixodbc

    - name: Cache CMake FetchContent (_deps)
      # Skip the GoogleTest + CLI11 + nlohmann/json re-clones on every CI
      # run. Key on cmake/Dependencies.cmake — that's where the version tags
      # are pinned since E3, so a bump busts the cache automatically.
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: cmake-deps-app-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j 4

    - name: Check the build did not write into the source tree
      # IMPROVEMENT_PLAN.md E2. cmake/Version.cmake used to configure_file()
      # version.hpp straight back into include/odbc_crusher/, which broke
      # read-only checkouts and let two build directories on different tags
      # fight over one file. It generates into build/generated/ now; this
      # step is what stops that regressing. Any new generated artifact that
      # lands in the source tree fails here rather than being papered over
      # with another .gitignore line.
      shell: bash
      run: |
        dirty="$(git status --porcelain --untracked-files=all)"
        if [[ -n "$dirty" ]]; then
          echo "::error::Configure/build modified the source tree:"
          echo "$dirty"
          exit 1
        fi
        echo "Source tree is clean after configure + build."

    - name: Run unit tests (without ODBC drivers)
      # `-L unit` selects every test tagged with the "unit" label in
      # tests/CMakeLists.txt — currently the 27 plumbing tests under
      # tests/unit/. Replaces a brittle name-regex that silently dropped
      # any new unit test that didn't happen to match.
      #
      # No `continue-on-error: true` — a failing unit test is a real
      # regression and must fail CI. Tests that need an unregistered
      # real driver should SKIP themselves at runtime, not be ignored
      # at the runner level.
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure -L unit --timeout 300

    - name: Download Mock Driver
      if: matrix.build_type == 'Release'
      uses: actions/download-artifact@v4
      with:
        name: mock-odbc-driver-${{ runner.os }}-Release
        path: mock-driver-artifact

    - name: Register Mock Driver and Run E2E Tests (Windows)
      if: runner.os == 'Windows' && matrix.build_type == 'Release'
      shell: pwsh
      # No `|| true` and no `continue-on-error: true` — once the mock
      # driver is registered, e2e failures are real regressions (the
      # whole §5.1 harness exists to catch them).
      run: |
        # upload-artifact@v4 strips the longest common prefix, so the
        # downloaded layout is build/<config>/mockodbc.dll + install/.
        $driverDest = "C:\Windows\System32\mockodbc.dll"
        Copy-Item mock-driver-artifact/build/Release/mockodbc.dll -Destination $driverDest
        & mock-driver-artifact/install/register.ps1 -DriverPath $driverDest
        # D51: in CI a driver that will not load must fail, not skip.
        $env:ODBC_CRUSHER_REQUIRE_MOCK = "1"
        ctest --test-dir build -C Release --output-on-failure -L e2e --timeout 300

    - name: Register Mock Driver and Run E2E Tests (Linux/macOS)
      if: runner.os != 'Windows' && matrix.build_type == 'Release'
      shell: bash
      run: |
        # On Ubuntu 24.04 (noble), the `odbcinst` binary lives in its
        # own package (not the main `unixodbc` package — apt installs
        # that one cleanly but it doesn't ship /usr/bin/odbcinst). The
        # script we call below needs that binary to register the driver.
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          sudo apt-get install -y --no-install-recommends odbcinst
        fi

        # Linux generates libmockodbc.so directly under build/ (single-
        # config Make/Ninja); macOS generates libmockodbc.dylib in the
        # same spot. The artifact glob above handles both.
        chmod +x mock-driver-artifact/install/register.sh
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          DRIVER=$(find mock-driver-artifact/build -name 'libmockodbc.so' | head -n1)
        else
          DRIVER=$(find mock-driver-artifact/build -name 'libmockodbc.dylib' | head -n1)
        fi
        # Resolve to absolute path — odbcinst stores it verbatim.
        DRIVER_ABS=$(readlink -f "$DRIVER" 2>/dev/null || python3 -c "import os,sys;print(os.path.abspath(sys.argv[1]))" "$DRIVER")
        # Use sudo for system-wide registration (/etc/odbcinst.ini) —
        # the per-user ~/.odbcinst.ini fallback isn't in unixODBC's
        # default driver lookup path, so the SQLDriverConnect from the
        # e2e binary wouldn't find the registration. register.sh has
        # built-in fallback paths for odbcinst, so sudoers' secure_path
        # stripping PATH no longer matters.
        sudo ./mock-driver-artifact/install/register.sh "$DRIVER_ABS"
        # D51: in CI a driver that will not load must fail, not skip.
        export ODBC_CRUSHER_REQUIRE_MOCK=1
        ctest --test-dir build -C Release --output-on-failure -L e2e --timeout 300

    - name: Report the reference-run baseline
      # D56: continue-on-error covers this step failing, not an earlier
      # one, so without always() the reference run is skipped in exactly
      # the job that failed - the one worth reading. Found on the macOS
      # runner, where the e2e step failed and this printed nothing.
      # IMPROVEMENT_PLAN Phase 6 is driven by this number: there is no
      # Linux machine to measure on, so each experiment in orders 43-47
      # pushes a change and reads the counts out of this step. ctest
      # swallows a passing test's output, which is why this runs the
      # tool directly rather than relying on the e2e harness's own
      # print. Never fails the job - it is a measurement, not a gate;
      # the gate is the e2e baseline assertion above.
      if: always() && matrix.build_type == 'Release'
      continue-on-error: true
      shell: bash
      run: |
        BIN=$(find build -name 'odbc-crusher' -type f | head -n1)
        "$BIN" "Driver={Mock ODBC Driver};Mode=Success;Catalog=Default;ResultSetSize=10;" \
            -o json -f baseline.json > /dev/null 2>&1 || true
        python3 - <<'PY'
        import json
        with open('baseline.json', encoding='utf-8') as fh:
            report = json.load(fh)
        summary = report['summary']
        keys = ('total_tests', 'passed', 'failed', 'skipped',
                'informational', 'scored', 'errors', 'pass_rate')
        print('[baseline]', {k: summary.get(k) for k in keys})
        for bucket in ('FAIL', 'ERROR', 'SKIP_UNSUPPORTED',
                       'SKIP_INCONCLUSIVE'):
            rows = [t for c in report['categories']
                    for t in c.get('tests', [])
                    if t.get('status') == bucket]
            if not rows:
                continue
            print('[baseline]', bucket, len(rows),
                  sorted(t['test_name'] for t in rows))
            # The reason, not just the name: orders 45-47 are about
            # *why* each of these does not pass on this platform, and
            # the name alone has never been enough to tell.
            for t in sorted(rows, key=lambda r: r['test_name']):
                print('[why]', t['test_name'], '::',
                      (t.get('actual') or '(no actual)')[:200])
        PY

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: matrix.build_type == 'Release'
      with:
        name: odbc-crusher-${{ runner.os }}-${{ matrix.build_type }}
        # Single per-OS path — Windows MSBuild emits build/src/Release/
        # while Linux/macOS Make emit build/src/. The upload step is
        # only enabled on Release, so no Debug/ confusion.
        path: |
          build/src/Release/odbc-crusher.exe
          build/src/odbc-crusher
        if-no-files-found: ignore

  sanitizers:
    timeout-minutes: 45
    name: ASan + UBSan (Linux Debug)
    runs-on: ubuntu-latest
    needs: build-mock-driver  # we want to run e2e under sanitizers too
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install ODBC dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc unixodbc-dev odbcinst

    - name: Cache CMake FetchContent (_deps)
      uses: actions/cache@v4
      with:
        path: build-san/_deps
        key: cmake-deps-san-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure with ASan + UBSan
      # `-fno-sanitize-recover=all` upgrades UBSan warnings into errors so a
      # signed overflow or null deref fails CI instead of buried logs.
      run: |
        cmake -B build-san -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: cmake --build build-san --config Debug -j 4

    - name: Download Mock Driver
      uses: actions/download-artifact@v4
      with:
        name: mock-odbc-driver-Linux-Release
        path: mock-driver-artifact

    - name: Register Mock Driver
      # Same registration story as the build-and-test Linux job, just
      # against the unsanitized mock-driver build (the .so itself doesn't
      # need ASan instrumentation — ASan still tracks malloc/free in the
      # caller, so leaks/UB in the application are caught regardless).
      run: |
        chmod +x mock-driver-artifact/install/register.sh
        DRIVER=$(find mock-driver-artifact/build -name 'libmockodbc.so' | head -n1)
        DRIVER_ABS=$(readlink -f "$DRIVER")
        sudo ./mock-driver-artifact/install/register.sh "$DRIVER_ABS"

    - name: Run tests under sanitizers
      # Run unit + e2e together — the sanitizer build catches application-
      # side leaks/UB in both the test plumbing and the §5.1 subprocess
      # harness (subprocess spawn / file IO / JSON parse is exactly where
      # ASan tends to find real bugs).
      #
      # CrashGuardTest deliberately dereferences NULL / triggers
      # AV-equivalent faults so we can verify the SEH/VEH guard catches them.
      # ASan intercepts those signals first and aborts the process, so the
      # guard has no chance to run. Exclude that suite from the sanitizer
      # config — it stays covered by the non-sanitizer CI jobs.
      env:
        ASAN_OPTIONS: detect_leaks=1:symbolize=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # D55: --timeout, because this is the job that wedged. Without it
      # ctest waits on a hung test until GitHub kills the runner six
      # hours later, and the log ends mid-suite with no failure named.
      run: ctest --test-dir build-san -C Debug --output-on-failure -E "CrashGuard" --timeout 300
