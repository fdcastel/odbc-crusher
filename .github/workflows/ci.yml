name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same branch — pushing N commits to a PR
# no longer queues N full matrix runs. Skip cancellation on push to
# main/master so a release-tag-adjacent run isn't killed mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-mock-driver:
    name: Build Mock ODBC Driver on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Install ODBC dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc unixodbc-dev

    - name: Install ODBC dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install unixodbc

    - name: Configure Mock Driver
      run: cmake -B mock-driver/build -S mock-driver -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build Mock Driver
      run: cmake --build mock-driver/build --config ${{ matrix.build_type }} -j 4

    - name: Check mockodbc.def export drift
      # .def is a Windows-only linker artifact, so the check only makes
      # sense on Windows. Runs on Release only to avoid duplicating the
      # work on Debug.
      if: runner.os == 'Windows' && matrix.build_type == 'Release'
      shell: pwsh
      run: |
        # Every name in EXPORTS must appear as `SQLRETURN SQL_API <name>(`
        # somewhere under mock-driver/src/. This catches exports that were
        # hand-added to the .def without a matching C++ implementation.
        $defFile = "mock-driver/src/mockodbc.def"
        $exports = Get-Content $defFile |
            Where-Object { $_ -match '^\s{4}SQL[A-Za-z0-9]+\s*$' } |
            ForEach-Object { $_.Trim() }
        # Flatten all source files into one big string so a single regex
        # hit anywhere is enough. Covers driver/ (SQLAllocHandle etc.) and
        # odbc/ (the W-variant wrappers in unicode_wrappers.cpp).
        $sources = (Get-ChildItem mock-driver/src -Filter *.cpp -Recurse |
            Get-Content -Raw) -join "`n"
        $missing = @()
        foreach ($exp in $exports) {
            $pattern = "SQLRETURN\s+SQL_API\s+" + [regex]::Escape($exp) + "\s*\("
            if ($sources -notmatch $pattern) {
                $missing += $exp
            }
        }
        if ($missing.Count -gt 0) {
            Write-Error "mockodbc.def exports are missing C++ implementations: $($missing -join ', ')"
            exit 1
        }
        Write-Host "All $($exports.Count) .def exports resolve to implementations."

    - name: Run Mock Driver Tests
      run: ctest --test-dir mock-driver/build -C ${{ matrix.build_type }} --output-on-failure

    - name: Upload Mock Driver Artifacts
      uses: actions/upload-artifact@v4
      if: matrix.build_type == 'Release'
      with:
        name: mock-odbc-driver-${{ runner.os }}-${{ matrix.build_type }}
        # Glob every possible binary name across the three platforms so
        # this list doesn't need a per-OS branch. upload-artifact ignores
        # missing matches when at least one path resolves.
        path: |
          mock-driver/build/**/mockodbc.dll
          mock-driver/build/**/mockodbc.lib
          mock-driver/build/**/libmockodbc.so
          mock-driver/build/**/libmockodbc.dylib
          mock-driver/install/register.ps1
          mock-driver/install/register.sh

  build-and-test:
    name: Build and Test ODBC Crusher on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-mock-driver  # Run after mock driver builds
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Install ODBC dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc unixodbc-dev

    - name: Install ODBC dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install unixodbc

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j 4

    - name: Run unit tests (without ODBC drivers)
      # `-L unit` selects every test tagged with the "unit" label in
      # tests/CMakeLists.txt — currently the 27 plumbing tests under
      # tests/unit/. Replaces a brittle name-regex that silently dropped
      # any new unit test that didn't happen to match.
      #
      # No `continue-on-error: true` — a failing unit test is a real
      # regression and must fail CI. Tests that need an unregistered
      # real driver should SKIP themselves at runtime, not be ignored
      # at the runner level.
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure -L unit

    - name: Download Mock Driver
      if: matrix.build_type == 'Release'
      uses: actions/download-artifact@v4
      with:
        name: mock-odbc-driver-${{ runner.os }}-Release
        path: mock-driver-artifact

    - name: Register Mock Driver and Run E2E Tests (Windows)
      if: runner.os == 'Windows' && matrix.build_type == 'Release'
      shell: pwsh
      # No `|| true` and no `continue-on-error: true` — once the mock
      # driver is registered, e2e failures are real regressions (the
      # whole §5.1 harness exists to catch them).
      run: |
        # upload-artifact@v4 strips the longest common prefix, so the
        # downloaded layout is build/<config>/mockodbc.dll + install/.
        $driverDest = "C:\Windows\System32\mockodbc.dll"
        Copy-Item mock-driver-artifact/build/Release/mockodbc.dll -Destination $driverDest
        & mock-driver-artifact/install/register.ps1 -DriverPath $driverDest
        ctest --test-dir build -C Release --output-on-failure -L e2e

    - name: Register Mock Driver and Run E2E Tests (Linux/macOS)
      if: runner.os != 'Windows' && matrix.build_type == 'Release'
      shell: bash
      run: |
        # On Ubuntu 24.04 (noble), the `odbcinst` binary lives in its
        # own package (not the main `unixodbc` package — apt installs
        # that one cleanly but it doesn't ship /usr/bin/odbcinst). The
        # script we call below needs that binary to register the driver.
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          sudo apt-get install -y --no-install-recommends odbcinst
        fi

        # Linux generates libmockodbc.so directly under build/ (single-
        # config Make/Ninja); macOS generates libmockodbc.dylib in the
        # same spot. The artifact glob above handles both.
        chmod +x mock-driver-artifact/install/register.sh
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          DRIVER=$(find mock-driver-artifact/build -name 'libmockodbc.so' | head -n1)
        else
          DRIVER=$(find mock-driver-artifact/build -name 'libmockodbc.dylib' | head -n1)
        fi
        # Resolve to absolute path — odbcinst stores it verbatim.
        DRIVER_ABS=$(readlink -f "$DRIVER" 2>/dev/null || python3 -c "import os,sys;print(os.path.abspath(sys.argv[1]))" "$DRIVER")
        # Use sudo for system-wide registration (/etc/odbcinst.ini) —
        # the per-user ~/.odbcinst.ini fallback isn't in unixODBC's
        # default driver lookup path, so the SQLDriverConnect from the
        # e2e binary wouldn't find the registration. register.sh has
        # built-in fallback paths for odbcinst, so sudoers' secure_path
        # stripping PATH no longer matters.
        sudo ./mock-driver-artifact/install/register.sh "$DRIVER_ABS"
        ctest --test-dir build -C Release --output-on-failure -L e2e

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: matrix.build_type == 'Release'
      with:
        name: odbc-crusher-${{ runner.os }}-${{ matrix.build_type }}
        # Single per-OS path — Windows MSBuild emits build/src/Release/
        # while Linux/macOS Make emit build/src/. The upload step is
        # only enabled on Release, so no Debug/ confusion.
        path: |
          build/src/Release/odbc-crusher.exe
          build/src/odbc-crusher
        if-no-files-found: ignore

  sanitizers:
    name: ASan + UBSan (Linux Debug)
    runs-on: ubuntu-latest
    needs: build-mock-driver  # we want to run e2e under sanitizers too
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install ODBC dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc unixodbc-dev odbcinst

    - name: Configure with ASan + UBSan
      # `-fno-sanitize-recover=all` upgrades UBSan warnings into errors so a
      # signed overflow or null deref fails CI instead of buried logs.
      run: |
        cmake -B build-san -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: cmake --build build-san --config Debug -j 4

    - name: Download Mock Driver
      uses: actions/download-artifact@v4
      with:
        name: mock-odbc-driver-Linux-Release
        path: mock-driver-artifact

    - name: Register Mock Driver
      # Same registration story as the build-and-test Linux job, just
      # against the unsanitized mock-driver build (the .so itself doesn't
      # need ASan instrumentation — ASan still tracks malloc/free in the
      # caller, so leaks/UB in the application are caught regardless).
      run: |
        chmod +x mock-driver-artifact/install/register.sh
        DRIVER=$(find mock-driver-artifact/build -name 'libmockodbc.so' | head -n1)
        DRIVER_ABS=$(readlink -f "$DRIVER")
        sudo ./mock-driver-artifact/install/register.sh "$DRIVER_ABS"

    - name: Run tests under sanitizers
      # Run unit + e2e together — the sanitizer build catches application-
      # side leaks/UB in both the test plumbing and the §5.1 subprocess
      # harness (subprocess spawn / file IO / JSON parse is exactly where
      # ASan tends to find real bugs).
      #
      # CrashGuardTest deliberately dereferences NULL / triggers
      # AV-equivalent faults so we can verify the SEH/VEH guard catches them.
      # ASan intercepts those signals first and aborts the process, so the
      # guard has no chance to run. Exclude that suite from the sanitizer
      # config — it stays covered by the non-sanitizer CI jobs.
      env:
        ASAN_OPTIONS: detect_leaks=1:symbolize=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest --test-dir build-san -C Debug --output-on-failure -E "CrashGuard"
